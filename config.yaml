  min_intervalo_eventos: 1.0
  alinear_imagenes: false
  max_desplazamiento: 30.0
web:
  enabled: true
  host: 0.0.0.0
  port: 5000
registro:
  log_eventos: eventos.jsonl
  save_changes: true
  output_dir: capturas_cambio
  max_imagenes: 20
  nivel: INFO
ia:
  enabled: false
  model: deepseek-v4-flash-vision-exp
  detail: low
