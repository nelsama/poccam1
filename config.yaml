# Configuración del Backend de Monitoreo de Paneles
# Generado por el panel web al guardar parámetros en vivo.
captura:
  fuente: camara
  camara_fuente: http://172.26.10.201:8080/video
  nombre_camara: panel-1
  region: null
  monitor: 1
  intervalo_segundos: 0.5
  aplicar_preset_al_iniciar: true
  rotacion: 90
  reconectar_segundos: 180.0
deteccion:
  metodo: ssim
  umbral: 0.5
